[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-occupational-curriculum-observatory"
version = "0.1.0"
description = "AI Occupational and Curriculum Exposure Observatory: task-level, explainable AI exposure assessment for occupations and curricula."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9", "pgvector>=0.2.5"]
ml = ["sentence-transformers>=3.0", "torch>=2.2"]
tracking = ["mlflow>=2.12"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
observatory = "observatory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
observatory = ["about/content/*.md", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["network: requires internet access", "realdata: requires downloaded official source files"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends()/Header() defaults are idiomatic

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
"src/observatory/about/*.py" = ["E501"]  # long human-readable strings (figure captions, formulas)
