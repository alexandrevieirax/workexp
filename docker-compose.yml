services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: observatory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observatory_dev_only}
      POSTGRES_DB: observatory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observatory"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      OBS_DATABASE_URL: postgresql+psycopg2://observatory:${POSTGRES_PASSWORD:-observatory_dev_only}@db:5432/observatory
      OBS_ADMIN_API_KEY: ${OBS_ADMIN_API_KEY:-change-me}
    command: >
      sh -c "alembic upgrade head && uvicorn observatory.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs

volumes:
  pgdata:
